[package]
name = "dotcfg"
version = "0.1.1"
edition = "2024"
description = "Flexible config management for Rust apps"
license = "MIT OR Apache-2.0"
keywords = ["config", "configuration", "cli", "toml", "yaml"]
authors = ["Adeloye Adetayo <spectra010s@gmail.com>"]
repository = "https://github.com/Spectra010s/dotcfg"
homepage = "https://github.com/Spectra010s/dotcfg"
documentation = "https://docs.rs/dotcfg"
readme = "README.md"
categories = ["config"]
rust-version = "1.85"

[features]
default = ["toml"]
toml = ["dep:toml"]
json = ["dep:serde_json"]
yaml = ["dep:serde_yaml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
home = "0.5"
etcetera = "0.8"
thiserror = "2"

[[example]]
name = "basic"
path = "examples/basic.rs"
